# cargo-deny settings, checked by the shared CI workflow.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# The desktop app runs on Windows, macOS, and Linux.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# To accept a specific advisory, add its ID here with a comment explaining why.
ignore = [
    # proc-macro-error is unmaintained. It's a build-time macro helper that
    # GTK's glib-macros 0.18 uses, which Tauri's tray icon brings on Linux
    # only. It runs no code in the app. Drop this when Tauri moves to a newer
    # GTK binding.
    "RUSTSEC-2024-0370",
    # zbus_names, zvariant, and zvariant_derive were merged into zbus 6.
    # zbus 5 still uses them, for the single-instance plugin's D-Bus calls on
    # Linux only. Nothing is known to be wrong with them. Drop these when the
    # plugin moves to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# Licenses that can be combined with AGPL-3.0. Check compatibility before you
# add one.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Accordion repos can depend on each other through Git.
[sources.allow-org]
github = ["accordion-suite"]
