name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: accordion-suite/accordion/.github/workflows/rust.yml@main
    with:
      # What Tauri needs to build the app on Linux: GTK, WebKit, the tray
      # icon, and SVG icons.
      linux-packages: >-
        libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
        librsvg2-dev libxdo-dev
      windows: true
